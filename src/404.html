<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA redirect: stores the full URL and redirects to index.html
      sessionStorage.redirect = location.href;
      location.replace(location.pathname.split('/').slice(0, 2).join('/') + '/');
    </script>
  </head>
  <body></body>
</html>
