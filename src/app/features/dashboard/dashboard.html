<div class="flex h-full">
  <!-- Desktop sidebar (md+) -->
  <div class="hidden md:block">
    <app-dashboard-sidebar
      [collapsed]="collapsed()"
      [activeProjectSlug]="activeProjectSlug() ?? null"
      (toggleCollapsed)="toggleCollapsed()"
    />
  </div>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-14 shrink-0 items-center gap-3 border-b border-border bg-sidebar px-4">
      <button
        type="button"
        class="grid size-9 cursor-pointer place-items-center rounded-md text-sidebar-foreground/80 hover:bg-sidebar-accent hover:text-sidebar-foreground md:hidden"
        aria-label="Open menu"
        (click)="openDrawer()"
      >
        <svg lucideMenu class="size-5" aria-hidden="true"></svg>
      </button>

      <div class="text-sm font-semibold tracking-tight">{{ headerTitle() }}</div>

      <div class="relative ml-4 hidden md:block">
        <svg
          lucideSearch
          class="pointer-events-none absolute left-3 top-1/2 size-3.5 -translate-y-1/2 text-muted-foreground"
          aria-hidden="true"
        ></svg>
        <input
          type="search"
          placeholder="Search issues..."
          aria-label="Search issues"
          class="h-9 w-72 rounded-md border border-border bg-background pl-9 pr-12 text-sm text-foreground placeholder:text-muted-foreground focus:border-ring focus:outline-hidden"
        />
        <kbd
          class="pointer-events-none absolute right-2 top-1/2 hidden -translate-y-1/2 rounded border border-border bg-muted px-1.5 py-0.5 text-[10px] font-medium text-muted-foreground sm:inline-block"
          >⌘K</kbd
        >
      </div>

      <div class="ml-auto flex items-center gap-2">
        <button
          type="button"
          aria-label="Create new issue"
          class="inline-flex h-9 cursor-pointer items-center gap-1.5 rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
        >
          <svg lucidePlus class="size-3.5" aria-hidden="true"></svg>
          <span class="hidden sm:inline">New issue</span>
        </button>
      </div>
    </header>

    <main class="flex-1 overflow-auto p-6">
      <h2 class="text-sm font-semibold text-foreground">Main</h2>
    </main>
  </div>
</div>
