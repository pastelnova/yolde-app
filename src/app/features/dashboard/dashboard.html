<div class="flex h-full">
  <!-- Desktop sidebar (md+) -->
  <div class="hidden md:block">
    <app-dashboard-sidebar
      [collapsed]="collapsed()"
      [activeProjectSlug]="activeProjectSlug() ?? null"
      (toggleCollapsed)="toggleCollapsed()"
    />
  </div>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-14 shrink-0 items-center gap-3 border-b border-border bg-sidebar px-4">
      <button
        type="button"
        class="grid size-9 cursor-pointer place-items-center rounded-md text-sidebar-foreground/80 hover:bg-sidebar-accent hover:text-sidebar-foreground md:hidden"
        aria-label="Open menu"
        (click)="openDrawer()"
      >
        <svg lucideMenu class="size-5" aria-hidden="true"></svg>
      </button>

      <!-- Breadcrumb -->
      <nav class="flex min-w-0 items-center gap-2 text-sm" aria-label="Breadcrumb">
        <span class="font-semibold tracking-tight text-foreground">{{ sectionLabel() }}</span>
        <span class="text-muted-foreground" aria-hidden="true">/</span>
        <span class="truncate text-muted-foreground">{{ activeProject().name }}</span>
      </nav>

      <div class="ml-auto flex items-center gap-3">
        <!-- View toggle -->
        <div class="hidden items-center gap-0.5 rounded-md border border-border bg-card p-0.5 sm:inline-flex">
          <button
            type="button"
            aria-label="Board view"
            class="grid size-7 cursor-pointer place-items-center rounded text-foreground"
          >
            <svg lucideLayoutGrid class="size-3.5" aria-hidden="true"></svg>
          </button>
          <button
            type="button"
            aria-label="List view"
            class="grid size-7 cursor-pointer place-items-center rounded text-muted-foreground hover:bg-accent hover:text-foreground"
          >
            <svg lucideList class="size-3.5" aria-hidden="true"></svg>
          </button>
        </div>

        <!-- Member avatars -->
        <div class="hidden -space-x-1.5 sm:flex" aria-label="Project members">
          @for (m of visibleMembers; track m.id) {
            <span
              class="grid size-7 place-items-center rounded-full text-[10px] font-semibold text-white ring-2 ring-sidebar"
              [style.background-color]="m.avatarColor"
              [attr.title]="m.fullName"
              [attr.aria-label]="m.fullName"
            >
              {{ m.initials }}
            </span>
          }
          @if (hiddenMemberCount > 0) {
            <span
              class="grid size-7 place-items-center rounded-full bg-muted text-[10px] font-semibold text-foreground ring-2 ring-sidebar"
              [attr.title]="hiddenMemberCount + ' more'"
            >
              +{{ hiddenMemberCount }}
            </span>
          }
        </div>

        <button
          type="button"
          aria-label="Create new issue"
          class="inline-flex h-9 cursor-pointer items-center gap-1.5 rounded-md bg-primary px-3 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
        >
          <svg lucidePlus class="size-3.5" aria-hidden="true"></svg>
          <span class="hidden sm:inline">New issue</span>
        </button>
      </div>
    </header>

    <main class="min-h-0 flex-1 overflow-hidden">
      @if (activeSection() === 'board') {
        <app-board [project]="activeProject()" />
      } @else {
        <div class="p-6">
          <h2 class="text-sm font-semibold text-foreground">{{ sectionLabel() }}</h2>
        </div>
      }
    </main>
  </div>
</div>
