<div class="article-item">
  <div>
    <div class="article-item-meta">
      <button type="button" class="article-avatar" (click)="onAuthorClick(article().author.username)">
        {{ article().author.username.charAt(0) | uppercase }}{{ article().author.username.charAt(1) | uppercase }}
      </button>
      <button type="button" class="article-author" (click)="onAuthorClick(article().author.username)">
        {{ article().author.username }}
      </button>
      <span class="article-date">{{ article().createdAt | date: 'mediumDate' }}</span>
    </div>
    <div class="article-title">{{ article().title }}</div>
    <div class="article-desc">{{ article().description }}</div>
    <div class="article-footer">
      @for (tag of article().tagList; track tag) {
        <button type="button" class="tag-chip" (click)="onTagClick(tag)">{{ tag }}</button>
      }
      <a class="read-more" [routerLink]="['/article', article().slug]">
        Read more
        <span class="arrow">&rarr;</span>
      </a>
    </div>
  </div>
  <button class="article-fav" (click)="toggleLike(article().slug)">
    <span class="material-symbols-outlined" [class.filled]="isFavorited()"> favorite </span>
    {{ favoritesCount() }}
  </button>
</div>
